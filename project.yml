name: CloudNativeZurich
options:
  bundleIdPrefix: io.tbsonio
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  CloudNativeZurich:
    type: application
    platform: iOS
    sources:
      - CloudNativeZurich
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.tbsonio.CloudNativeZurich
        PRODUCT_NAME: CloudNativeZurich
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: CloudNativeZurich/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: CloudNativeZurich/Info.plist
    resources:
      - CloudNativeZurich/Fonts/**/*.ttf
schemes:
  CloudNativeZurich:
    build:
      targets:
        CloudNativeZurich: all
