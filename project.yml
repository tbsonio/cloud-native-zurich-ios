name: CloudNativeZurich
options:
  bundleIdPrefix: io.tbson
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
targets:
  CloudNativeZurich:
    type: application
    platform: iOS
    sources:
      - path: CloudNativeZurich
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.tbson.cloudnativezurich
        INFOPLIST_FILE: CloudNativeZurich/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: CloudNativeZurich/Info.plist
      properties:
        CFBundleDisplayName: Cloud Native Zurich
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
name: CloudNativeZurich
options:
  bundleIdPrefix: io.tbsonio
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: YES
targets:
  CloudNativeZurich:
    type: application
    platform: iOS
    sources:
      - CloudNativeZurich
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.tbsonio.CloudNativeZurich
        PRODUCT_NAME: CloudNativeZurich
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Cloud Native Zurich
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  CloudNativeZurich:
    build:
      targets:
        CloudNativeZurich: all
